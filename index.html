<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ginny's 12th Birthday — Nature Adventure Invitation</title>
<meta property="og:title" content="Ginny's 12th Birthday Nature Adventure">
<meta property="og:description" content="Look up, look far — come join my birthday hike!">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: #16213e;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    touch-action: pan-y;
  }

  .book-wrap {
    position: relative;
    width: min(92vw, 560px);
    max-width: 92vw;
    perspective: 1800px;
  }
  .book {
    position: relative;
    width: 100%;
    aspect-ratio: 2 / 1;
    transform-style: preserve-3d;
  }

  .page, .flipper {
    position: absolute; inset: 0;
    border-radius: 10px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
  }
  .page img, .face img {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
    background: #efe9dd;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* 翻页动画层 */
  .flipper {
    z-index: 50;
    transform-style: preserve-3d;
    will-change: transform;
    box-shadow: none;
  }
  .flipper .face {
    position: absolute; inset: 0;
    border-radius: 10px;
    overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
  }
  .flipper .face.back { transform: rotateY(180deg); }
  .flipper.animating { transition: transform .9s cubic-bezier(.55,.06,.3,.9); }

  .page { display: none; }
  .page.active { display: block; }

  /* 翻页时的高光阴影 */
  .shade {
    position: absolute; inset: 0;
    background: linear-gradient(to left, rgba(0,0,0,.28), rgba(0,0,0,0) 55%);
    pointer-events: none;
    opacity: 0;
    transition: opacity .9s;
    z-index: 60;
    border-radius: 10px;
  }

  /* 底部控制 */
  .controls {
    margin-top: 22px;
    display: flex; align-items: center; gap: 18px;
  }
  .nav-btn {
    width: 46px; height: 46px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.08);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .25s;
  }
  .nav-btn:hover { background: rgba(255,255,255,.2); }
  .nav-btn:disabled { opacity: .25; cursor: default; }

  .dots { display: flex; gap: 10px; }
  .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: rgba(255,255,255,.3);
    cursor: pointer;
    transition: all .3s;
  }
  .dot.on { background: #ffd97a; transform: scale(1.35); }

  .page-num {
    color: rgba(255,255,255,.55);
    font-size: 13px;
    letter-spacing: 2px;
    margin-top: 16px;
  }

  /* 首次提示 */
  .hint {
    position: absolute;
    right: -8px; top: 50%;
    transform: translateY(-50%);
    color: #fff;
    font-size: 14px;
    background: rgba(0,0,0,.55);
    padding: 10px 16px;
    border-radius: 24px;
    white-space: nowrap;
    z-index: 80;
    animation: hintFloat 1.6s ease-in-out infinite;
    transition: opacity .4s;
    pointer-events: none;
  }
  .hint.gone { opacity: 0; }
  @keyframes hintFloat {
    0%,100% { transform: translateY(-50%) translateX(0); }
    50% { transform: translateY(-50%) translateX(-10px); }
  }

  @media (max-height: 560px) {
    .controls { margin-top: 12px; }
    .page-num { margin-top: 8px; }
  }
</style>
</head>
<body>

<div class="book-wrap" id="bookWrap">
  <div class="book" id="book">
    <div class="page active" data-theme="cover"><img src="images/cover.jpg" alt="Cover — Look Up Look Far"></div>
    <div class="page" data-theme="inner1"><img src="images/inner1.jpg" alt="Trail map & invitation"></div>
    <div class="page" data-theme="inner2"><img src="images/inner2.jpg" alt="How to join us"></div>
    <div class="page" data-theme="back"><img src="images/back.jpg" alt="We look forward to seeing you"></div>
  </div>
  <div class="hint" id="hint">左滑或点击翻页 ›</div>
</div>

<div class="controls">
  <button class="nav-btn" id="prevBtn" aria-label="上一页">‹</button>
  <div class="dots" id="dots"></div>
  <button class="nav-btn" id="nextBtn" aria-label="下一页">›</button>
</div>
<div class="page-num" id="pageNum">1 / 4</div>

<script>
(function () {
  var pages = Array.prototype.slice.call(document.querySelectorAll('.page'));
  var book = document.getElementById('book');
  var wrap = document.getElementById('bookWrap');
  var dotsBox = document.getElementById('dots');
  var pageNum = document.getElementById('pageNum');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var hint = document.getElementById('hint');
  var cur = 0, flipping = false;

  // 主题底色（与每页画面配色呼应）
  var themes = {
    cover:  'linear-gradient(160deg,#2c4a7c 0%,#7fa3d1 45%,#e8a583 100%)',
    inner1: 'linear-gradient(160deg,#efe7d4 0%,#e3d7bd 60%,#cbb98e 100%)',
    inner2: 'linear-gradient(160deg,#efe7d4 0%,#e3d7bd 60%,#cbb98e 100%)',
    back:   'linear-gradient(160deg,#1f8ba0 0%,#59b7c4 55%,#c97b3d 100%)'
  };

  // 页码圆点
  pages.forEach(function (_, i) {
    var d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' on' : '');
    d.addEventListener('click', function () { if (i !== cur) goTo(i); });
    dotsBox.appendChild(d);
  });
  var dots = Array.prototype.slice.call(dotsBox.children);

  function setBodyBg(i) {
    var key = pages[i].getAttribute('data-theme');
    document.body.style.background = themes[key] || '#16213e';
  }

  function updateUI() {
    dots.forEach(function (d, i) { d.classList.toggle('on', i === cur); });
    pageNum.textContent = (cur + 1) + ' / ' + pages.length;
    prevBtn.disabled = (cur === 0);
    nextBtn.disabled = (cur === pages.length - 1);
    setBodyBg(cur);
  }

  function makeFlipper() {
    var f = document.createElement('div');
    f.className = 'flipper';
    var front = document.createElement('div');
    front.className = 'face front';
    var back = document.createElement('div');
    back.className = 'face back';
    f.appendChild(front); f.appendChild(back);
    return f;
  }

  function pageClone(i) {
    var img = document.createElement('img');
    img.src = pages[i].querySelector('img').src;
    img.alt = '';
    return img;
  }

  function goTo(target) {
    if (flipping || target === cur || target < 0 || target >= pages.length) return;
    flipping = true;
    hint.classList.add('gone');

    var forward = target > cur;
    var flipper = makeFlipper();

    if (forward) {
      // 正翻：正面=当前页，背面=目标页
      flipper.querySelector('.front').appendChild(pageClone(cur));
      flipper.querySelector('.back').appendChild(pageClone(target));
      flipper.style.transform = 'rotateY(0deg)';
      wrap.appendChild(flipper);
      // 强制 reflow 后开始动画
      void flipper.offsetWidth;
      flipper.classList.add('animating');
      flipper.style.transform = 'rotateY(-180deg)';
    } else {
      // 反翻：从 -180 转回 0，正面=目标页，背面=当前页
      flipper.querySelector('.front').appendChild(pageClone(target));
      flipper.querySelector('.back').appendChild(pageClone(cur));
      flipper.style.transform = 'rotateY(-180deg)';
      wrap.appendChild(flipper);
      void flipper.offsetWidth;
      flipper.classList.add('animating');
      flipper.style.transform = 'rotateY(0deg)';
    }

    pages[cur].classList.remove('active');
    pages[target].classList.add('active');

    setTimeout(function () {
      flipper.remove();
      cur = target;
      flipping = false;
      updateUI();
    }, 920);
  }

  function next() { goTo(cur + 1); }
  function prev() { goTo(cur - 1); }

  nextBtn.addEventListener('click', next);
  prevBtn.addEventListener('click', prev);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === ' ') next();
    if (e.key === 'ArrowLeft') prev();
  });

  // 点击翻页（点击右 2/3 下一页，左 1/3 上一页）
  wrap.addEventListener('click', function (e) {
    var r = wrap.getBoundingClientRect();
    var x = e.clientX - r.left;
    if (x > r.width * 0.33) next(); else prev();
  });

  // 滑动手势
  var sx = 0, sy = 0, tracking = false;
  wrap.addEventListener('touchstart', function (e) {
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; tracking = true;
  }, { passive: true });
  wrap.addEventListener('touchend', function (e) {
    if (!tracking) return;
    tracking = false;
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0) next(); else prev();
    }
  }, { passive: true });

  setBodyBg(0);
  updateUI();
})();
</script>
</body>
</html>
